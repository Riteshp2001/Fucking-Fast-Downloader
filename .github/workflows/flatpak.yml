name: Flatpak

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flatpak-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and validate Flatpak
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Flatpak and Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes flatpak flatpak-builder appstream \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev
          flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --noninteractive --assumeyes flathub org.gnome.Sdk//46 org.gnome.Platform//46
      - name: Validate manifest and AppStream metadata
        run: |
          flatpak-builder-lint manifest flatpak/com.ff-downloader.app.yml
          appstreamcli validate --no-net flatpak/com.ff-downloader.app.metainfo.xml
      - name: Build Flatpak bundle
        run: bash flatpak/build.sh
      - name: Install and inspect Flatpak
        run: |
          flatpak --user remote-add --no-gpg-verify --if-not-exists ff-local "file://$GITHUB_WORKSPACE/flatpak/repo"
          flatpak --user install --noninteractive --assumeyes ff-local com.ff-downloader.app
          flatpak info com.ff-downloader.app
          flatpak run --command=sh com.ff-downloader.app -c 'test -x /app/bin/ff-downloader && test -f /app/share/metainfo/com.ff-downloader.app.metainfo.xml'
          flatpak --user update --noninteractive --assumeyes ff-local
      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-x86_64
          path: dist/*.flatpak
          if-no-files-found: error
          retention-days: 14
