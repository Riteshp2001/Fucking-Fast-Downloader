name: Release Builds

on:
  push:
    tags:
      - "v*.*.*"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
    paths:
      - ".github/workflows/release-builds.yml"
      - "scripts/build_release.py"
      - "requirements.txt"
      - "requirements-dev.txt"
      - "pyproject.toml"
      - "ff_downloader/**"
      - "tests/**"
      - "main.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.ref }}-${{ github.event.action || 'run' }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release source
    if: github.event_name != 'pull_request' || github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Verify release version consistency
        env:
          PR_HEAD: ${{ github.event.pull_request.head.ref || '' }}
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          from ff_downloader.config import APP_VERSION

          project_version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if project_version != APP_VERSION:
              raise SystemExit(
                  f"pyproject.toml version {project_version} does not match APP_VERSION {APP_VERSION}"
              )

          ref = os.environ.get("GITHUB_REF", "")
          if ref.startswith("refs/tags/"):
              tag_version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
              if tag_version != APP_VERSION:
                  raise SystemExit(
                      f"Tag v{tag_version} does not match APP_VERSION {APP_VERSION}"
                  )

          pr_head = os.environ.get("PR_HEAD", "")
          if pr_head.startswith("release/v"):
              match = re.fullmatch(r"release/v(\d+\.\d+\.\d+)(?:[-/].+)?", pr_head)
              if not match:
                  raise SystemExit(f"Invalid release branch name: {pr_head}")
              branch_version = match.group(1)
              if branch_version != APP_VERSION:
                  raise SystemExit(
                      f"Release branch {pr_head} targets {branch_version}, "
                      f"but APP_VERSION is {APP_VERSION}"
                  )

          print(f"Release version verified: {APP_VERSION}")
          PY

      - name: Lint
        run: python -m ruff check ff_downloader tests scripts main.py

      - name: Test
        run: python -m pytest -q

      - name: Compile Python sources
        run: python -m compileall -q ff_downloader tests scripts main.py

  build:
    name: Build ${{ matrix.label }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            label: Windows x64
            artifact: release-windows-x64
          - os: ubuntu-24.04
            label: Linux x64
            artifact: release-linux-x64
          - os: macos-15
            label: macOS arm64
            artifact: release-macos-arm64
          - os: macos-15-intel
            label: macOS x64
            artifact: release-macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install nsis --no-progress -y

      - name: Build portable app and native installer
        run: python scripts/build_release.py --output release

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'pull_request' &&
       github.event.action == 'closed' &&
       github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.head.ref, 'release/v'))
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download packaged artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt

      - name: Resolve release tag
        id: release
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            version=$(python -c "import runpy; print(runpy.run_path('ff_downloader/config.py')['APP_VERSION'])")
            tag="v${version}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Verify release source matches existing tag
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          git fetch --force --tags
          if git show-ref --tags --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            tag_sha=$(git rev-list -n 1 "$RELEASE_TAG")
            if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
              echo "::error::${RELEASE_TAG} already points to ${tag_sha}; refusing to publish binaries built from ${GITHUB_SHA}."
              exit 1
            fi
          fi

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          title="Fucking Fast Downloader ${RELEASE_TAG}"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          elif git show-ref --tags --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            gh release create "$RELEASE_TAG" release-assets/* \
              --generate-notes \
              --verify-tag \
              --title "$title"
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --generate-notes \
              --target "$GITHUB_SHA" \
              --title "$title"
          fi
