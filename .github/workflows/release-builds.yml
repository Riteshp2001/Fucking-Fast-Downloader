name: Release Builds

on:
  push:
    tags:
      - "v*.*.*"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/release-builds.yml"
      - "scripts/build_release.py"
      - "requirements.txt"
      - "requirements-dev.txt"
      - "pyproject.toml"
      - "main.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Verify tag matches application version
        if: startsWith(github.ref, 'refs/tags/')
        run: python -c "import os; from ff_downloader.config import APP_VERSION; tag = os.environ['GITHUB_REF_NAME'].removeprefix('v'); raise SystemExit(0 if tag == APP_VERSION else f'Tag v{tag} does not match APP_VERSION {APP_VERSION}')"

      - name: Lint
        run: python -m ruff check ff_downloader tests scripts main.py

      - name: Test
        run: python -m pytest -q

      - name: Compile Python sources
        run: python -m compileall -q ff_downloader tests scripts main.py

  build:
    name: Build ${{ matrix.label }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            label: Windows x64
            artifact: release-windows-x64
          - os: ubuntu-24.04
            label: Linux x64
            artifact: release-linux-x64
          - os: macos-15
            label: macOS arm64
            artifact: release-macos-arm64
          - os: macos-15-intel
            label: macOS x64
            artifact: release-macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Build packaged application
        run: python scripts/build_release.py --output release

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* --generate-notes --verify-tag
          fi
