[project]
name = "fucking-fast-downloader"
version = "2.1.0"
description = "PyQt desktop downloader for public FuckingFast share links"
requires-python = ">=3.10"
dependencies = [
  "PyQt5>=5.15.10",
  "requests>=2.31.0",
  "beautifulsoup4>=4.12.3",
  "camoufox>=0.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
# Session-log timestamps intentionally display the user's local wall-clock time.
# PALETTES is a static theme lookup table and is never mutated at runtime.
"ff_downloader/ui/main_window.py" = ["DTZ005", "RUF012"]
# Embedded Solar SVG glyph data is a static read-only lookup table.
"ff_downloader/ui/solar_icons.py" = ["RUF012"]
# Browser polling/teardown loops intentionally swallow transient exceptions,
# mirroring the upstream Fitgirl-Easy-Downloader flow.
"ff_downloader/core/browser_resolver.py" = ["S110", "BLE001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live_network: uses a real public URL; enable explicitly with LIVE_DOWNLOAD_TESTS=1",
]
